limit_conn_zone $binary_remote_addr zone=od_per_ip_conn:10m;
limit_conn_zone $server_name zone=od_global_conn:10m;
limit_req_zone $server_name zone=od_global_rate:10m rate=80r/s;

server {
    listen 5002;
    server_name _;

    access_log /mnt/data2/object_detection/logs/nginx-access.log;
    error_log /mnt/data2/object_detection/logs/nginx-error.log warn;

    client_max_body_size 0;
    client_body_timeout 30s;
    limit_conn od_per_ip_conn 64;
    limit_conn od_global_conn 128;
    limit_req zone=od_global_rate burst=160 nodelay;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header Connection "";
    proxy_request_buffering off;
    proxy_connect_timeout 2s;

    location = /predict_video {
        proxy_read_timeout 1900s;
        proxy_send_timeout 1900s;
        proxy_pass http://127.0.0.1:5090;
    }

    location / {
        proxy_read_timeout 20s;
        proxy_send_timeout 20s;
        proxy_pass http://127.0.0.1:5090;
    }
}
